<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <style>
      .word { font-family: 'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 120px; }
      .glyph { stroke: #000000; stroke-width: 8; stroke-linejoin: round; paint-order: stroke fill; }
      .purple { fill: #8B2FE8; }
      .white  { fill: #FFFFFF; }
      .green  { fill: #22C55E; }
    </style>
  </defs>
  <text x="20" y="120" class="word">
    <tspan class="glyph purple">M</tspan><tspan class="glyph white">ov</tspan><tspan class="glyph green">ez</tspan>
  </text>
</svg>
